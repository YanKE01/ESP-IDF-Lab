<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ESP-IDF Lab banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- chip illustration -->
  <g transform="translate(905 160)">
    <g stroke="#64748b" stroke-width="4" stroke-linecap="round">
      <path d="M-60 -95v-25M-30 -95v-25M0 -95v-25M30 -95v-25M60 -95v-25"/>
      <path d="M-60 95v25M-30 95v25M0 95v25M30 95v25M60 95v25"/>
      <path d="M-95 -60h-25M-95 -30h-25M-95 0h-25M-95 30h-25M-95 60h-25"/>
      <path d="M95 -60h25M95 -30h25M95 0h25M95 30h25M95 60h25"/>
    </g>
    <rect x="-95" y="-95" width="190" height="190" rx="18" fill="#111827" stroke="url(#accent)" stroke-width="4"/>
    <rect x="-62" y="-62" width="124" height="124" rx="10" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="0" y="-8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#f8fafc">ESP32</text>
    <text x="0" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">S3 · P4 · C5</text>
  </g>

  <!-- signal traces -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.8">
    <path d="M785 100H740l-20 -20H660"/>
    <path d="M785 220H740l-20 20H660"/>
    <path d="M1025 130h40l20 -20h50"/>
    <path d="M1025 190h40l20 20h50"/>
  </g>
  <g fill="#f97316">
    <circle cx="660" cy="80" r="5"/><circle cx="660" cy="240" r="5"/>
    <circle cx="1135" cy="110" r="5"/><circle cx="1135" cy="210" r="5"/>
  </g>

  <!-- text -->
  <rect x="64" y="72" width="64" height="6" rx="3" fill="url(#accent)"/>
  <text x="64" y="140" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#f8fafc">ESP-IDF Lab</text>
  <text x="64" y="186" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Hands-on experiments &amp; reference projects for ESP chips</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e2e8f0">
    <rect x="64" y="216" width="120" height="34" rx="17" fill="#1f2937" stroke="#475569"/>
    <text x="124" y="238" text-anchor="middle">AI / DL</text>
    <rect x="194" y="216" width="96" height="34" rx="17" fill="#1f2937" stroke="#475569"/>
    <text x="242" y="238" text-anchor="middle">USB</text>
    <rect x="300" y="216" width="104" height="34" rx="17" fill="#1f2937" stroke="#475569"/>
    <text x="352" y="238" text-anchor="middle">Audio</text>
    <rect x="414" y="216" width="150" height="34" rx="17" fill="#1f2937" stroke="#475569"/>
    <text x="489" y="238" text-anchor="middle">Peripherals</text>
  </g>
</svg>
