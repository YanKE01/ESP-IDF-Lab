name: Build ESP-IDF projects

on:
  push:
  workflow_dispatch:
    inputs:
      target:
        description: ESP chip target to build
        required: true
        default: all
        type: choice
        options:
          - all
          - esp32s3
          - esp32p4
          - esp32c5

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install configuration dependency
        run: python -m pip install pyyaml

      - name: Generate build matrix
        id: matrix
        env:
          SELECTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          matrix="$(python tools/ci/generate_build_matrix.py --target "$SELECTED_TARGET")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python -m json.tool

  build:
    name: ${{ matrix.target }} · ${{ matrix.path }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
